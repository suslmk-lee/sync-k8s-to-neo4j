apiVersion: v1
kind: ServiceAccount
metadata:
  name: neo4j-sync-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: neo4j-sync-role
rules:
- apiGroups: [""]
  resources: ["namespaces", "pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: neo4j-sync-binding
subjects:
- kind: ServiceAccount
  name: neo4j-sync-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: neo4j-sync-role
  apiGroup: rbac.authorization.k8s.io